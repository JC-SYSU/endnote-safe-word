name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Validate tag and publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate tag matches project version
        run: |
          VERSION="$(python -c "import sys; sys.path.insert(0, 'src'); import endnote_safe_word; print(endnote_safe_word.__version__)")"
          TAG="${GITHUB_REF_NAME#v}"
          test "$TAG" = "$VERSION" || {
            echo "::error::tag v$TAG does not match project version $VERSION"
            exit 1
          }
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes