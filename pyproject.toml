[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "endnote-safe-word"
version = "0.1.0a4"
description = "Conservative OOXML guardrails for editing Word documents containing EndNote CWYW fields"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "EndNote Safe Word contributors"}]
dependencies = ["lxml>=5.0"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Office Suites",
]

[project.optional-dependencies]
mcp = ["mcp>=1.29,<2"]
dev = ["build>=1.2", "pytest>=8.0", "tomli>=2.0; python_version < '3.11'"]

[project.scripts]
endnote-safe-word = "endnote_safe_word.cli:main"
word-document-safe-editing-mcp = "endnote_safe_word.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
