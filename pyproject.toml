[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "word-document-safe-editing"
version = "0.1.0a4"
description = "Conservative OOXML guardrails for editing Word documents containing EndNote CWYW fields"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "EndNote Safe Word contributors"}]
dependencies = ["lxml>=5.0"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Office Suites",
]

[project.optional-dependencies]
mcp = ["mcp>=1.29,<2"]
dev = ["pytest>=8.0", "packaging>=23"]

[project.scripts]
word-document-safe-editing = "word_document_safe_editing.cli:main"
word-document-safe-editing-mcp = "word_document_safe_editing.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
